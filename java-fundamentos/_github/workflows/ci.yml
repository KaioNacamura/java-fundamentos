name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Compilar e testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test
